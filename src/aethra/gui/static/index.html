<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c5cff'/%3E%3Cpath d='M10 22 16 8l6 14' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>window.AETHRA_TOKEN = "__TOKEN__";</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo">A</span><div><b>Aethra</b><small id="version"></small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-status"></div>
  </aside>
  <main>
    <header id="topbar">
      <div class="file">
        <button class="ghost" id="btn-open" title="Open another show file">📂</button>
        <div><div id="file-name">—</div><small id="file-path"></small></div>
      </div>
      <div class="top-actions">
        <span id="validity" class="badge">…</span>
        <button class="ghost" id="btn-revert" disabled>Discard changes</button>
        <button class="primary" id="btn-save" disabled>Save <kbd>Ctrl+S</kbd></button>
      </div>
    </header>
    <section id="problems" class="hidden"></section>
    <section id="page"></section>
  </main>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="modal-box"><div id="modal-body"></div></div></div>
<script src="/static/app.js"></script>
</body>
</html>
