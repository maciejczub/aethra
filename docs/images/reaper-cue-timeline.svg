<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A cue note in the REAPER timeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa6c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a47c"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <style>
      .title { fill: #ffffff; font-size: 17px; font-weight: 600; }
      .head { fill: #ffffff; font-size: 14px; font-weight: 600; }
      .text { fill: #d6dcef; font-size: 13px; }
      .muted { fill: #9aa6c7; font-size: 12px; }
      .label { fill: #c9d1ea; font-size: 12.5px; }
      .mono { fill: #d6dcef; font-size: 12.5px; font-family: Cascadia Mono, Consolas, Menlo, monospace; }
      .box { fill: #0b1a3d; stroke: #2a3b6e; stroke-width: 1.5; }
      .tile { fill: #14245a; stroke: #2a3b6e; stroke-width: 1.5; }
      .key { fill: #14245a; stroke: #6b3dd4; stroke-width: 1.5; }
      .outer { fill: none; stroke: #3a4d86; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { stroke: #9aa6c7; stroke-width: 1.8; fill: none; }
      .violet { stroke: #8b5cf6; stroke-width: 2.2; fill: none; }
      .green { stroke: #00a47c; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="270" rx="18" fill="#06142f"/>

  <rect x="150" y="40" width="190" height="200" fill="#0b1a3d"/>
  <text x="245" y="60" class="muted" text-anchor="middle">count-in</text>
  <path d="M340 34 V 244" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="60" class="label">bar 1 of the song</text>
  <path d="M340 72 H 960" class="line" stroke-width="3"/>
  <text x="30" y="77" class="head">timeline</text>
  <text x="30" y="127" class="head">VIDEO CUES</text>
  <rect x="340" y="110" width="22" height="24" rx="3" fill="#8b5cf6"/>
  <text x="376" y="121" class="text">note 38, channel 16, 1/16 long</text>
  <text x="376" y="138" class="muted">item "03 Ballad n38"</text>
  <text x="30" y="177" class="head">MTC</text>
  <rect x="150" y="166" width="810" height="16" rx="4" fill="#14245a" stroke="#2a3b6e"/>
  <text x="555" y="178" class="muted" text-anchor="middle">one generator item for the whole show</text>
  <text x="30" y="225" class="head">Aethra</text>
  <path d="M340 220 H 372" class="green" marker-end="url(#arrow-green)"/>
  <text x="380" y="225" class="text">frame 0 of 03-ballad.mp4 on stage (offset 0)</text>

</svg>
