<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>REAPER to Aethra connection</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa6c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a47c"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <style>
      .title { fill: #ffffff; font-size: 17px; font-weight: 600; }
      .head { fill: #ffffff; font-size: 14px; font-weight: 600; }
      .text { fill: #d6dcef; font-size: 13px; }
      .muted { fill: #9aa6c7; font-size: 12px; }
      .label { fill: #c9d1ea; font-size: 12.5px; }
      .mono { fill: #d6dcef; font-size: 12.5px; font-family: Cascadia Mono, Consolas, Menlo, monospace; }
      .box { fill: #0b1a3d; stroke: #2a3b6e; stroke-width: 1.5; }
      .tile { fill: #14245a; stroke: #2a3b6e; stroke-width: 1.5; }
      .key { fill: #14245a; stroke: #6b3dd4; stroke-width: 1.5; }
      .outer { fill: none; stroke: #3a4d86; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { stroke: #9aa6c7; stroke-width: 1.8; fill: none; }
      .violet { stroke: #8b5cf6; stroke-width: 2.2; fill: none; }
      .green { stroke: #00a47c; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="470" rx="18" fill="#06142f"/>

  <text x="40" y="42" class="title">REAPER computer</text>
  <text x="196" y="42" class="muted">192.168.77.1</text>
  <rect x="30" y="56" width="330" height="290" rx="12" class="box"/>
  <rect x="50" y="76" width="200" height="40" rx="8" class="tile"/>
  <text x="62" y="101" class="text">backing tracks → audio interface</text>
  <path d="M250 96 H 300" class="line" marker-end="url(#arrow)"/>
  <text x="306" y="100" class="label">PA</text>
  <rect x="50" y="132" width="200" height="44" rx="8" class="key"/>
  <text x="62" y="152" class="head" font-size="13.5">VIDEO CUES track</text>
  <text x="62" y="168" class="muted">notes, MIDI channel 16</text>
  <rect x="50" y="188" width="200" height="44" rx="8" class="tile"/>
  <text x="62" y="208" class="head" font-size="13.5">MTC track</text>
  <text x="62" y="224" class="muted">generator item (optional)</text>
  <rect x="50" y="280" width="200" height="44" rx="8" class="tile"/>
  <text x="62" y="300" class="head" font-size="13.5">OSC control surface</text>
  <text x="62" y="316" class="muted">optional</text>
  <path d="M250 154 H 290 V 234" class="violet"/>
  <path d="M250 210 H 290" class="violet"/>
  <rect x="262" y="236" width="112" height="38" rx="8" fill="#14245a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="318" y="252" class="muted" text-anchor="middle">rtpMIDI session</text>
  <text x="318" y="267" class="label" text-anchor="middle" font-size="11">AETHRA-REAPER</text>

  <text x="640" y="42" class="title">show laptop</text>
  <text x="746" y="42" class="muted">192.168.77.2</text>
  <rect x="630" y="56" width="340" height="290" rx="12" class="box"/>
  <rect x="644" y="236" width="110" height="38" rx="8" fill="#14245a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="699" y="252" class="muted" text-anchor="middle">rtpMIDI session</text>
  <text x="699" y="267" class="label" text-anchor="middle" font-size="11">AETHRA-STAGE</text>
  <rect x="770" y="236" width="180" height="38" rx="8" class="key"/>
  <text x="860" y="260" class="head" text-anchor="middle" font-size="13.5">Aethra</text>
  <path d="M754 255 H 768" class="violet" marker-end="url(#arrow-violet)"/>
  <path d="M374 255 H 642" class="violet" marker-end="url(#arrow-violet)"/>
  <path d="M250 302 H 840 V 276" class="line" marker-end="url(#arrow)"/>
  <rect x="770" y="112" width="180" height="56" rx="8" class="tile"/>
  <text x="860" y="136" class="head" text-anchor="middle" font-size="13.5">compositor</text>
  <text x="860" y="154" class="muted" text-anchor="middle">libmpv layers</text>
  <path d="M860 236 V 170" class="line" marker-end="url(#arrow)"/>
  <path d="M860 112 V 82" class="green" marker-end="url(#arrow-green)"/>
  <text x="872" y="92" class="label">projector</text>
  <text x="872" y="106" class="muted" font-size="11">stage output</text>

  <rect x="400" y="200" width="190" height="130" rx="10" fill="none" stroke="#3a4d86" stroke-dasharray="5 4"/>
  <text x="495" y="222" class="head" text-anchor="middle" font-size="13">Ethernet</text>
  <text x="495" y="239" class="muted" text-anchor="middle">direct cable</text>
  <text x="495" y="291" class="label" text-anchor="middle">OSC, UDP 9000</text>

  <text x="40" y="392" class="head" font-size="13.5">Alternative to Ethernet + rtpMIDI</text>
  <rect x="40" y="406" width="190" height="40" rx="8" class="tile"/>
  <text x="135" y="431" class="text" text-anchor="middle">USB MIDI interface</text>
  <path d="M230 426 H 418" class="violet" marker-end="url(#arrow-violet)"/>
  <text x="324" y="418" class="muted" text-anchor="middle">5-pin MIDI cable</text>
  <rect x="420" y="406" width="190" height="40" rx="8" class="tile"/>
  <text x="515" y="431" class="text" text-anchor="middle">USB MIDI interface</text>

</svg>
